# Render Blueprint Specification for Food Hub
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: fh-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: restaurant_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_REGISTRATION_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. React Frontend Single Page Application (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: tfj-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      # Single-Page-App (SPA) rewrite rule for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically wires the backend's live URL into the frontend at build time
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: fh-backend
          envVarKey: RENDER_EXTERNAL_URL
